<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event - EventEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/guard.js"></script>
</head>
<body id="page-create-event">

  <header class="navbar">
    <div class="container navbar-inner">
      <a class="logo" href="organizer-dashboard.html">Event<span>Ease</span></a>
      <button class="menu-button" id="menuButton">☰ Menu</button>
      <nav class="nav-links" id="navLinks">
          <a href="organizer-dashboard.html">Dashboard</a>
          <a href="create-event.html" class="active">Create Event</a>
          <a href="manage-events.html">Manage Events</a>
          <a href="attendee-list.html">Attendees</a>
          <a href="reports.html">Reports</a>
          <a href="settings.html">Settings</a>
          <a href="index.html" id="logoutLink">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 id="pageTitle">Create Event</h1>
      <p class="muted">Fields marked with * are required.</p>
    </div>

    <div class="card form-box">
    <div id="createMessage" class="message hidden"></div>

      <form id="createEventForm">
        <div class="form-group">
          <label for="eventTitleInput">Event title *</label>
          <input type="text" id="eventTitleInput">
        </div>
        <div class="form-group">
          <label for="eventDescriptionInput">Description *</label>
          <textarea id="eventDescriptionInput"></textarea>
        </div>
        <div class="form-group">
          <label for="eventCategoryInput">Category *</label>
          <select id="eventCategoryInput">
            <option value="">Choose a category</option>
            <option value="Technology">Technology</option><option value="Workshop">Workshop</option><option value="Career">Career</option><option value="Leadership">Leadership</option><option value="Sports">Sports</option><option value="Arts & Music">Arts & Music</option>
          </select>
        </div>
        <div class="form-group">
          <label for="eventDateInput">Date *</label>
          <input type="date" id="eventDateInput">
        </div>
        <div class="form-group">
          <label for="eventTimeInput">Time *</label>
          <input type="time" id="eventTimeInput">
        </div>
        <div class="form-group">
          <label for="eventVenueInput">Venue *</label>
          <input type="text" id="eventVenueInput">
        </div>
        <div class="form-group">
          <label for="eventCapacityInput">Capacity *</label>
          <input type="number" id="eventCapacityInput" min="1">
        </div>
        <div class="form-group">
          <label for="eventImageInput">Image URL (optional)</label>
          <input type="url" id="eventImageInput" placeholder="https://...">
        </div>
        <button type="submit" class="btn btn-primary" id="submitButton">Create Event</button>
        <a class="btn btn-outline" href="manage-events.html">Cancel</a>
      </form>

      <div id="successBox" class="hidden">
        <div class="message success" id="successText"></div>
        <div class="button-row">
          <a class="btn btn-primary" href="manage-events.html">Go to Manage Events</a>
          <a class="btn btn-outline" id="successViewLink" href="attendee-list.html">View Attendees</a>
          <a class="btn btn-outline" href="create-event.html">Create Another</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 EventEase · Midterm demo project · All events and people shown are sample data.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/organizer.js"></script>
</body>
</html>
