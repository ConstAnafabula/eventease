<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EventEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/guard.js"></script>
</head>
<body id="page-register">

  <header class="navbar">
    <div class="container navbar-inner">
      <a class="logo" href="index.html">Event<span>Ease</span></a>
      <button class="menu-button" id="menuButton">☰ Menu</button>
      <nav class="nav-links" id="navLinks">
          <a href="index.html">Home</a>
          <a href="login.html">Login</a>
          <a href="register.html" class="active">Register</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card auth-box">
      <h1>Create an account</h1>
      <p class="muted">Join EventEase to find and manage campus events.</p>
    <div id="registerMessage" class="message hidden"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@campus.edu">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="Type the password again">
        </div>
        <div class="form-group">
          <label for="accountType">Account type</label>
          <select id="accountType">
            <option value="student">Student</option>
            <option value="organizer">Organizer</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <p style="margin-top: 16px;">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 EventEase · Midterm demo project · All events and people shown are sample data.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
